services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 69-s3-app:latest
    container_name: 69-s3-app
    restart: unless-stopped
    ports:
      - "1337:1337"
    env_file:
      - .env
    volumes:
      - strapi-data:/app/.tmp
      - strapi-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1337/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - strapi-network

volumes:
  strapi-data:
    driver: local
  strapi-uploads:
    driver: local

networks:
  strapi-network:
    driver: bridge
